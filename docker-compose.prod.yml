version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: malware-postgres
    environment:
      POSTGRES_USER: malware_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: malware_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malware_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - malware_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: malware-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - malware_network

  # FastAPI Backend
  fastapi:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    image: malware-fastapi:latest
    container_name: malware-fastapi
    environment:
      DATABASE_URL: postgresql://malware_user:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/malware_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - malware_network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: ./api
      dockerfile: Dockerfile.celery
    image: malware-celery:latest
    container_name: malware-celery
    command: celery -A tasks worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://malware_user:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/malware_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: 1
    depends_on:
      - postgres
      - redis
      - fastapi
    networks:
      - malware_network
    restart: unless-stopped

  # Streamlit UI
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: malware-ui:latest
    container_name: malware-ui
    environment:
      API_URL: http://fastapi:8000
      PYTHONUNBUFFERED: 1
    ports:
      - "8501:8501"
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - malware_network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional, for production SSL)
  nginx:
    image: nginx:alpine
    container_name: malware-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - fastapi
      - ui
    networks:
      - malware_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  malware_network:
    driver: bridge
